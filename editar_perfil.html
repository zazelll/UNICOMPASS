<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar perfil - UNiCompass</title>
    <link rel="stylesheet" href="css/stile_menu.css">
  </head>
  <body>
    <div class="page-shell">
      <div class="card">
        <h1>Editar perfil</h1>
        <p class="intro">Actualiza tus datos personales para mantener tu cuenta vigente.</p>
        <div class="form-group">
          <label for="editNombre">Nombre</label>
          <input id="editNombre" type="text">
        </div>
        <div class="form-group">
          <label for="editApellido">Apellido</label>
          <input id="editApellido" type="text">
        </div>
        <div class="form-group">
          <label for="editUsuario">Usuario</label>
          <input id="editUsuario" type="text" disabled>
        </div>
        <div class="form-group">
          <label for="editEmail">Correo electrónico</label>
          <input id="editEmail" type="email">
        </div>
        <div class="form-group">
          <label for="editEscuela">Escuela</label>
          <input id="editEscuela" type="text">
        </div>
        <div class="form-group">
          <label for="editNivelEscuela">Nivel de escuela</label>
          <select id="editNivelEscuela">
            <option value="">Selecciona un nivel</option>
                <option value="preparatoria">Preparatoria</option>
                <option value="universidad">Universidad</option>
              </select>
            
        </div>
        
        <div class="form-group">
          <label for="editSemestre">Semestre</label>
          <input id="editSemestre" type="text">
        </div>
        <div class="form-group">
          <label for="editLugar">Lugar de la escuela</label>
          <input id="editLugar" type="text">
        </div>
        <div class="form-group">
          <label for="editPromedio">Calif. promedio</label>
          <input id="editPromedio" type="text">
        </div>
        <div class="action-row">
          <button class="button" id="guardarButton" type="button">Guardar cambios</button>
          <a class="button button-secondary" href="menu.html">Volver al menú</a>
        </div>
        <p id="editMensaje" class="small-text"></p>
      </div>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
