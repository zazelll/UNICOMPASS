<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - UNiCompass</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/profile.css">
  </head>
  <body>
    <div class="page-shell">
      <div class="container profile-container">
        <div class="card">
          <h1>Perfil de usuario</h1>
          <p class="intro">Consulta tus datos guardados y actualiza tu perfil cuando lo necesites.</p>
          <div class="form-group">
            <label>Nombre completo</label>
            <p><span id="nombreCompleto"></span></p>
          </div>
          <div class="form-group">
            <label>Usuario</label>
            <p><span id="usuarioActual"></span></p>
          </div>
          <div class="form-group">
            <label>Correo electrónico</label>
            <p><span id="emailActual"></span></p>
          </div>
          <div class="form-group">
            <label>Estado</label>
            <p><span id="estadoActual"></span></p>
          </div>
          <div class="form-group">
            <label>Municipio o alcaldía</label>
            <p><span id="municipioActual"></span></p>
          </div>
          <div class="action-row">
            <a class="button" href="menu.html">Volver al menú</a>
            <a class="button button-secondary" href="editar_perfil.html">Editar perfil</a>
          </div>
        </div>
      </div>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/sheets-config.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
