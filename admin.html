<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - UNiCompass</title>
    <link rel="stylesheet" href="css/stile_menu.css">
  </head>
  <body>
    <div class="page-shell">
      <div class="container">
        <div class="card">
          <h1>Administrador</h1>
          <p class="intro">Inicia sesión para gestionar usuarios registrados.</p>
          <div class="form-group">
            <label for="loginUsuario">Usuario</label>
            <input id="loginUsuario" type="text">
          </div>
          <div class="form-group">
            <label for="loginPassword">Contraseña</label>
            <input id="loginPassword" type="password">
          </div>
          <div class="action-row">
            <button class="button" id="loginButton" type="button">Iniciar sesión</button>
          </div>
          <p id="loginMensaje" class="small-text"></p>
        </div>

        <div id="adminPanel" class="card" style="display:none;">
          <h2>Panel de administración</h2>
          <div class="form-group">
            <label for="searchUsuario">Buscar usuario</label>
            <input id="searchUsuario" type="text">
          </div>
          <div class="action-row">
            <button class="button" id="searchButton" type="button">Buscar</button>
          </div>
          <p class="intro">Usuarios registrados:</p>
          <table id="usersTable">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Usuario</th>
                <th>Email</th>
                <th>Escuela</th>
                <th>Semestre</th>
                <th>Lugar</th>
                <th>Promedio</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <div class="action-row">
            <button class="button button-danger" id="logoutLink" type="button">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
