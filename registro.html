<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - UNiCompass</title>
    <link rel="stylesheet" href="css/stile_menu.css">
  </head>
  <body>
    <div class="page-shell">
      <div class="card">
        <h1>Crear cuenta</h1>
        <p class="intro">Completa los datos para comenzar tu búsqueda vocacional.</p>
        <div class="form-group">
          <label for="registerNombre">Nombre</label>
          <input id="registerNombre" type="text">
        </div>
        <div class="form-group">
          <label for="registerApellido">Apellido</label>
          <input id="registerApellido" type="text">
        </div>
        <div class="form-group">
          <label for="registerUsuario">Nombre de usuario</label>
          <input id="registerUsuario" type="text">
        </div>
        <div class="form-group">
          <label for="registerEmail">Correo electrónico</label>
          <input id="registerEmail" type="email">
        </div>
        <div class="form-group">
          <label for="registerPassword">Contraseña de usuario</label>
          <input id="registerPassword" type="password">
        </div>
        <div class="form-group">
          <label for="registerEscuela">nombre de la Escuela</label>
          <input id="registerEscuela" type="text">
        </div>
      <div class="form-group">
          <label for="registerNivelEscuela">Nivel de escuela</label>
          <select id="registerNivelEscuela">
            <option value="">Selecciona un nivel</option>
            <option value="preparatoria">Preparatoria</option>
            <option value="universidad">Universidad</option>
          </select>
        </div>

        <div class="form-group">
          <label for="registerSemestre">Semestre que cursa</label>
          <input id="registerSemestre" type="text">
        </div>
        <div class="form-group">
          <label for="registerLugar">Lugar de la escuela</label>
          <input id="registerLugar" type="text">
        </div>
        <div class="form-group">
          <label for="registerPromedio">Calif. promedio</label>
          <input id="registerPromedio" type="text">
        </div>
        <div class="action-row">
          <button class="button" id="registerButton" type="button">Registrarse</button>
          <a class="button button-secondary" href="secion.html">Iniciar sesión</a>
        </div>
        <p id="registerMensaje" class="small-text"></p>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
