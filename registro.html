<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Registro</title>
  </head>
  <body>
    <h1>Registro</h1>
    <p>Nombre: <input id="registerNombre" type="text"></p>
    <p>Apellido: <input id="registerApellido" type="text"></p>
    <p>Usuario: <input id="registerUsuario" type="text"></p>
    <p>Correo electrónico: <input id="registerEmail" type="email"></p>
    <p>Contraseña: <input id="registerPassword" type="password"></p>
    <p>Escuela: <input id="registerEscuela" type="text"></p>
    <p>Semestre: <input id="registerSemestre" type="text"></p>
    <p>Lugar de la escuela: <input id="registerLugar" type="text"></p>
    <p>Calif. promedio: <input id="registerPromedio" type="text"></p>
    <p><button id="registerButton" type="button">Registrarse</button></p>
    <p id="registerMensaje"></p>
    <p>¿Ya tienes una cuenta? <a href="secion.html">Inicia sesión aquí</a></p>
    <script src="main.js"></script>
  </body>
</html>
