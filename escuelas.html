<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escuelas - UNiCompass</title>
    <link rel="stylesheet" href="css/stile_menu.css">
  </head>
  <body>
    <div class="page-shell">
      <div class="card">
        <h1>Escuelas</h1>
        <p class="intro">Plantilla lista para mostrar tus resultados cuando se conecte la encuesta.</p>

        <div class="container">
          <div class="left-panel chart-panel">
            <h2>Sugerencias</h2>
            <div id="suggestionBox" class="suggestion-card"></div>
          </div>

          <div class="center-panel chart-panel">
            <h2>Estadísticas</h2>
            <canvas id="statsChart" width="420" height="240"></canvas>
          </div>

          <div class="right-panel chart-panel">
            <h2>Habilidades</h2>
            <canvas id="skillsChart" width="420" height="240"></canvas>
          </div>
        </div>

        <div class="action-row">
          <a class="button" href="menu.html">Volver al menú</a>
        </div>
      </div>
    </div>

    <script src="js/escuelas.js"></script>
  </body>
</html>
