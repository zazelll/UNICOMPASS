<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - UNiCompass</title>
    <link rel="stylesheet" href="css/stile_menu.css">
  </head>
  <body>
    <div class="page-shell">
      <div class="card">
        <h1>Iniciar sesión</h1>
        <p class="intro">Accede a tu cuenta para continuar con la evaluación vocacional.</p>
        <div class="form-group">
          <label for="loginUsuario">Usuario</label>
          <input id="loginUsuario" type="text">
        </div>
        <div class="form-group">
          <label for="loginPassword">Contraseña</label>
          <input id="loginPassword" type="password">
        </div>
        <div class="action-row">
          <button class="button" id="loginButton" type="button">Iniciar sesión</button>
          <a class="button button-secondary" href="registro.html">Regístrate</a>
        </div>
        <p id="loginMensaje" class="small-text"></p>
      </div>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
