<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Menú</title>
    <link rel="stylesheet" href="css/stile_menu.css">
  </head>
  <body>
    <div class="page-shell">
      <div class="container">
        <div class="left-panel">
          <h1>Menú</h1>
          
          <p>Bienvenido, <span id="nombreCompleto"></span></p>
          <p>Nivel académico: <span id="registerNivelEscuela"></span></p>
          
          <p>Usuario: <span id="usuarioActual"></span></p>

            <a class="button" id="startSurveyLink" href="vocacional.html">Empezar encuesta</a>

        </div>
        <div class="right-panel map-panel">

        <div class="right-panel selection-panel">
          
          <p>Escuela actualmente:</p>
          <ul id="seleccionadasList">
          <p>Escuelas seleccionadas:</p>
            <!-- Las escuelas seleccionadas se mostrarán aquí -->
          </ul>
          <p>ver mas</p>
          <a class="button" href="escuelas.html">Ver escuelas</a>
        </div>

      </div>
      <a class="button" href="nosotros.html">Sobre nosotros</a>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/menu.js"></script>
  </body>
</html>
